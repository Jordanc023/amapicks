server {
    listen 80;
    server_name gbleagues.duckdns.org www.gbleagues.duckdns.org;
    
    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirigir todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gbleagues.duckdns.org www.gbleagues.duckdns.org;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gbleagues.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gbleagues.duckdns.org/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AMAPICKS Logging
    access_log /var/log/nginx/amapicks-access.log;
    error_log /var/log/nginx/amapicks-error.log;

    # Backend API - proxy a PM2 en puerto 8001
    location /api/ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Frontend - servir archivos estáticos build
    location / {
        root /home/amarelita/amapicks/web/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache para assets con hash
        location ~* "\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Cache para assets estáticos sin hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
    }
}
