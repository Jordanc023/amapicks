server {
    listen 80;
    server_name _;  # Acepta cualquier dominio/IP

    # GBLEAGUES Logging
    access_log /var/log/nginx/gbleagues-access.log;
    error_log /var/log/nginx/gbleagues-error.log;

    # Backend API - proxy a PM2 en puerto 8000
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Frontend - servir archivos estáticos build
    location / {
        root /home/jordanvps/amapicks/web/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
