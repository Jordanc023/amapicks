version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: gbleagues-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./web/backend/.env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SECRET_KEY=${SECRET_KEY}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=https://TU_DOMINIO.com/api/auth/callback
      - FRONTEND_URL=https://TU_DOMINIO.com
      - ADMIN_IDS=${ADMIN_IDS}
    networks:
      - gbleagues-network

  # Frontend React (Vite)
  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: gbleagues-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://TU_DOMINIO.com/api
    depends_on:
      - backend
    networks:
      - gbleagues-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gbleagues-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - gbleagues-network

  # Certbot para SSL (Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: gbleagues-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gbleagues-network

networks:
  gbleagues-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-www:
